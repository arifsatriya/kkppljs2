<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=
          "width=device-width, initial-scale=1.0">
    <title>Popup Form</title>
    <style>
       
/* Pengaturan halaman */
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #f0f0f0;
}

/* Tombol */
button {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.btn-open-popup,
.btn-submit {
    background: green;
}

.btn-open-popup {
    font-size: 18px;
}

.btn-open-popup:hover,
.btn-submit:hover {
    background: #4caf50;
}

/* Overlay popup */
.overlay-container {
    display: none;
    position: fixed;
    inset: 0;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0;
    transition: opacity 0.3s;
}

.overlay-container.show {
    display: flex;
    opacity: 1;
}

/* Kotak popup */
.popup-box {
    width: 320px;
    padding: 24px;
    border-radius: 12px;
    background: white;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    animation: fadeInUp 0.5s ease-out;
}

.popup-box h2 {
    color: green;
}

/* Form */
.form-container {
    display: flex;
    flex-direction: column;
}

.form-label {
    margin-bottom: 10px;
    color: #444;
    text-align: left;
}

.form-input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

/* Tombol submit dan close */
.btn-submit,
.btn-close-popup {
    padding: 12px 24px;
}

.btn-close-popup {
    margin-top: 12px;
    background: #e74c3c;
}

.btn-close-popup:hover {
    background: #c0392b;
}

/* Animasi popup */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

    </style>
</head>

<body>

    <button class="btn-open-popup" onclick="togglePopup()">
      Open Popup Form
      </button>

    <div id="popupOverlay" 
         class="overlay-container">
        <div class="popup-box">
            <h2 style="color: green;">Popup Form</h2>
            <form class="form-container">
                <label class="form-label" 
                       for="name">
                  Username:
                  </label>
                <input class="form-input" type="text" 
                       placeholder="Enter Your Username" 
                       id="name" name="name" required>

                <label class="form-label" for="email">Email:</label>
                <input class="form-input"
                       type="email" 
                       placeholder="Enter Your Email"
                       id="email" 
                       name="email" required>

                <button class="btn-submit" 
                        type="submit">
                  Submit
                  </button>
            </form>

            <button class="btn-close-popup" 
                    onclick="togglePopup()">
              Close
              </button>
        </div>
    </div>

    <script>
        function togglePopup() {
            const overlay = document.getElementById('popupOverlay');
            overlay.classList.toggle('show');
        }
    </script>
</body>

</html>
